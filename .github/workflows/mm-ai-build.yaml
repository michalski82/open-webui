name: MM-AI — Build and publish Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: mm-ai-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/michalski82/open-webui:main
            ghcr.io/michalski82/open-webui:latest
          build-args: |
            BUILD_HASH=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/michalski82/open-webui:cache
          cache-to: type=registry,ref=ghcr.io/michalski82/open-webui:cache,mode=max
